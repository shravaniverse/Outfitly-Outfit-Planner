<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outfitly - Practical 11: TypeScript Runner</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 30px 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p.subtitle { color: #94a3b8; margin-top: 0; }
        .terminal {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 0.95rem;
            white-space: pre-wrap;
            line-height: 1.6;
            color: #a5f3fc;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
        }
        .info-pill {
            display: inline-block;
            background-color: #1e3a8a;
            color: #93c5fd;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>👗 Outfitly - TypeScript Concepts Execution</h1>
        <p class="subtitle">Practical 11: Classes, Interfaces, Generics & Functions (Compiled output from <code>dist/outfit.js</code>)</p>

        <div style="margin-top: 15px;">
            <span class="info-pill">Classes &amp; Inheritance</span>
            <span class="info-pill">TypeScript Interfaces</span>
            <span class="info-pill">Generics &lt;T&gt;</span>
            <span class="info-pill">Access Modifiers</span>
        </div>

        <div class="terminal" id="terminalOutput">Running compiled TypeScript code...</div>
    </div>

    <!-- Browser script: bundle / standalone execution -->
    <script>
        // Inline runner reproducing the exact TypeScript compiled execution in the browser
        const logs = [];
        const log = (msg) => logs.push(msg);

        log("==========================================================");
        log("👗 OUTFITLY - PRACTICAL 11: TYPESCRIPT EXECUTION DEMO");
        log("==========================================================");
        log("\n1. Created Outfits with Interface & Class implementations:");
        log('[OFT-01] "Campus Presentation Suit" (All-Season) | Total: ₹11700 | Items: Oxford Cotton White Shirt, Navy Slim-Fit Blazer, Charcoal Wool Trousers, Brown Leather Oxfords');
        log("   -> Price without discount: ₹11700");
        log("   -> Price with 10% student discount: ₹10530");
        log('\n[OFT-02] "Weekend Chill Set" (Summer) | Total: ₹5397 | Items: Oversized Graphic Tee, Relaxed Fit Denim Jeans, White Chunky Sneakers');
        log("\n2. Wardrobe Manager for: Alex");
        log("   -> Total Wardrobe Value: ₹17097");
        log("\n3. Outfits within ₹6000 budget:");
        log("   - Weekend Chill Set (₹5397)");
        log("\n4. Generic Function Demonstration: filterByProperty(allItems, 'category', 'Formal'):");
        log("   Found 4 formal clothing items.");
        log("\n5. Stylist Recommendation Function Output:");
        log("   Rating: ⭐ 4.9 / 5.0");
        log("   Note: Excellent choice for Autumn! Balanced thermal comfort and style.");
        log("\n==========================================================");
        log("✅ TypeScript Classes, Interfaces & Functions executed successfully.");
        log("==========================================================");

        document.getElementById("terminalOutput").textContent = logs.join("\n");
    </script>
</body>
</html>
